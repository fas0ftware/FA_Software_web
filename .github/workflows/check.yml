name: site check

on:
  push:
  pull_request:

permissions:
  contents: read   # the check only reads the site; the token gets nothing else

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails on broken links, missing files and images without alt text.
      # Leftover placeholders only warn here; --strict (see README) makes them fail.
      - run: python3 tools/check_site.py
